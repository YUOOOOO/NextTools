[package]
name = "nexttools-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "nexttools_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
host-core.workspace = true
nexttools-protocol.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
jsonwebtoken = "9"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"
tauri-plugin-global-shortcut = "2"
