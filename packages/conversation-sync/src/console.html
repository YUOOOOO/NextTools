<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话同步</title>
<style>
  body { margin: 0; font: 15px/1.5 "Segoe UI", sans-serif; background: #f4f1ea; color: #1c1a16; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  form, section { background: #fff; border: 1px solid #e4ddd0; border-radius: 16px; padding: 16px; margin-top: 16px; }
  label { display: block; margin: 10px 0; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cfc6b8; border-radius: 8px; }
  button { margin-right: 8px; padding: 8px 14px; border-radius: 999px; border: 0; background: #1c1a16; color: #fff; }
  button.secondary { background: #efeae1; color: #1c1a16; }
  .error { color: #9d1c1c; }
  article { border-top: 1px solid #eee6da; padding: 12px 0; }
  .meta { color: #6d665c; font-size: 13px; }
  pre { white-space: pre-wrap; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>会话同步</h1>
  <p>账号和密码注册或登录。登录后可以向在线的桌面发一条消息，由桌面本机执行。</p>
  <p id="error" class="error"></p>
  <form id="auth">
    <label>账号 <input id="account" autocomplete="username"></label>
    <label>密码 <input id="password" type="password" autocomplete="current-password"></label>
    <button type="submit">登录</button>
    <button id="register" class="secondary" type="button">注册</button>
  </form>
  <section id="chats" hidden>
    <p id="summary"></p>
    <form id="profile">
      <label>名字 <input id="name"></label>
      <button type="submit">保存资料</button>
    </form>
    <div id="devices" class="meta"></div>
    <form id="control">
      <label>动作
        <select id="action">
          <option value="chat.send">chat.send</option>
          <option value="info">info</option>
          <option value="sessions.list">sessions.list</option>
          <option value="files">files</option>
          <option value="shell">shell</option>
          <option value="screen">screen</option>
        </select>
      </label>
      <label>参数 <input id="command" placeholder="文字、路径或命令"></label>
      <button type="submit">发给桌面</button>
      <p id="control-status" class="meta"></p>
    </form>
    <button id="reload" class="secondary" type="button">刷新</button>
    <button id="signout" class="secondary" type="button">退出</button>
    <div id="list"></div>
  </section>
</main>
<script>
const error = document.querySelector("#error");
const auth = document.querySelector("#auth");
const chats = document.querySelector("#chats");
const tokenKey = "conversation-sync-token";
function showError(message) { error.textContent = message || ""; }
async function call(path, options = {}) {
  const headers = { ...(options.body ? { "content-type": "application/json" } : {}) };
  const token = sessionStorage.getItem(tokenKey);
  if (token) headers.authorization = "Bearer " + token;
  const response = await fetch(path, { ...options, headers });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error?.message || response.statusText);
  return body;
}
async function load() {
  const state = await call("/v1/sync/state");
  const page = await call("/v1/sync/changes?since=0&tail=200");
  document.querySelector("#summary").textContent =
    `${state.counts.conversations} 个会话，${state.counts.messages} 条消息，游标 ${state.cursor}`;
  const byCid = new Map(page.conversations.map((item) => [item.cid, item]));
  const groups = new Map();
  for (const message of page.messages) {
    if (!groups.has(message.cid)) groups.set(message.cid, []);
    groups.get(message.cid).push(message);
  }
  const list = document.querySelector("#list");
  list.replaceChildren();
  const ids = new Set([...byCid.keys(), ...groups.keys()]);
  if (!ids.size) list.textContent = "还没有同步上来的聊天。";
  for (const cid of ids) {
    const conversation = byCid.get(cid);
    const article = document.createElement("article");
    const title = document.createElement("strong");
    title.textContent = conversation?.title || cid;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${conversation?.kind || "side"} · ${conversation?.deleted ? "已删除" : "保留"}`;
    article.append(title, meta);
    for (const message of groups.get(cid) || []) {
      const line = document.createElement("pre");
      line.textContent = `${message.role}: ${message.text}`;
      article.append(line);
    }
    list.append(article);
  }
  auth.hidden = true;
  chats.hidden = false;
}
auth.addEventListener("submit", async (event) => {
  event.preventDefault();
  await enter("/v1/auth/login");
});
document.querySelector("#register").addEventListener("click", () => enter("/v1/auth/register"));
document.querySelector("#reload").addEventListener("click", () => load().catch((cause) => showError(cause.message)));
document.querySelector("#control").addEventListener("submit", (event) => {
  event.preventDefault();
  const action = document.querySelector("#action").value;
  const text = document.querySelector("#command").value.trim();
  if (!hub || hub.readyState !== WebSocket.OPEN) {
    showError("桌面还没连上");
    return;
  }
  const target = devices.find((device) => device.kind === "computer" && device.online);
  if (!target) {
    showError("没有在线的桌面");
    return;
  }
  const args = action === "chat.send" ? { text } : action === "shell" ? { command: text } : action === "files" ? { path: text || "~" } : {};
  const id = "web-" + Date.now();
  pending = id;
  document.querySelector("#control-status").textContent = "已发给 " + (target.name || target.id);
  hub.send(JSON.stringify({ type: "call", id, to: target.id, action, args }));
});
document.querySelector("#profile").addEventListener("submit", async (event) => {
  event.preventDefault();
  try {
    await call("/v1/me/profile", { method: "PUT", body: JSON.stringify({ name: document.querySelector("#name").value }) });
  } catch (cause) {
    showError(cause.message);
  }
});
let hub = null;
let devices = [];
let pending = "";
function connectHub(token) {
  if (hub) hub.close();
  const socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/hub");
  hub = socket;
  socket.addEventListener("open", () => {
    socket.send(JSON.stringify({ type: "hello", key: token, device: { name: "Browser", kind: "web", actions: [] } }));
  });
  socket.addEventListener("message", (event) => {
    const frame = JSON.parse(event.data);
    if (frame.type === "welcome" || frame.type === "devices") {
      devices = frame.devices || [];
      document.querySelector("#devices").textContent = devices.map((device) => `${device.name} ${device.kind} ${device.online ? "在线" : "离线"}`).join(" · ");
    }
    if (frame.type === "result" && frame.id === pending) {
      document.querySelector("#control-status").textContent = frame.ok ? "桌面已收下" : (frame.message || "桌面拒绝了");
      pending = "";
    }
    if (frame.type === "error" && frame.id === pending) {
      document.querySelector("#control-status").textContent = frame.message || frame.code;
      pending = "";
    }
  });
}
document.querySelector("#signout").addEventListener("click", () => {
  sessionStorage.removeItem(tokenKey);
  auth.hidden = false;
  chats.hidden = true;
});
async function enter(path) {
  showError("");
  try {
    const result = await call(path, {
      method: "POST",
      body: JSON.stringify({
        account: document.querySelector("#account").value,
        password: document.querySelector("#password").value,
      }),
    });
    sessionStorage.setItem(tokenKey, result.token);
    connectHub(result.token);
    await load();
  } catch (cause) {
    showError(cause.message);
  }
}
if (sessionStorage.getItem(tokenKey)) load().catch(() => sessionStorage.removeItem(tokenKey));
</script>
</body>
</html>
