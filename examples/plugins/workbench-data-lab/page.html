<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>Data Lab</title>
    <style>
      :root { color-scheme: dark; --bg: #181818; --surface: #222; --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --accent: #8b5cf6; }
      :root[data-base="light"] { color-scheme: light; --bg: #fff; --surface: #f4f4f5; --fg: #18181b; --muted: #52525b; --line: #d4d4d8; --accent: #6d28d9; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
      main { max-width: 520px; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
      h1 { margin: 0; font-size: 20px; }
      p { color: var(--muted); }
      #counter { display: block; margin: 24px 0; font-size: 56px; font-weight: 600; }
      .actions { display: flex; gap: 8px; }
      button { border: 1px solid var(--line); border-radius: 7px; padding: 8px 18px; color: var(--fg); background: var(--bg); font: inherit; cursor: pointer; }
      button.primary { border-color: var(--accent); color: white; background: var(--accent); }
      #notice { min-height: 22px; margin-bottom: 0; overflow-wrap: anywhere; }
      #notice.error { color: #f87171; }
    </style>
  </head>
  <body>
    <main>
      <h1>Data Lab</h1>
      <p>Workbench and Agent share this counter. Click +1 here, then ask the Agent to increment it.</p>
      <output id="counter" aria-label="Shared counter" aria-live="polite">—</output>
      <div class="actions">
        <button id="increment" class="primary">+1</button>
        <button id="reset">Reset</button>
      </div>
      <p id="notice" role="status">Loading…</p>
    </main>
    <script>
      const counter = document.getElementById("counter");
      const notice = document.getElementById("notice");
      let revision = -1;
      const service = (args) => window.pluginBridge.invoke("workbench.service", { name: "data", args });
      async function update(action = "get") {
        try {
          const value = await service({ action });
          if (value.revision < revision) return;
          revision = value.revision;
          counter.textContent = String(value.counter);
          notice.textContent = `Shared counter · revision ${revision} · refreshes every 2 seconds`;
          notice.classList.remove("error");
        } catch (error) {
          notice.textContent = `Request failed: ${error?.message ?? error}`;
          notice.classList.add("error");
        }
      }
      document.getElementById("increment").addEventListener("click", () => void update("increment"));
      document.getElementById("reset").addEventListener("click", () => void update("reset"));
      const applyAppearance = (appearance) => {
        document.documentElement.dataset.base = appearance?.base === "light" ? "light" : "dark";
      };
      window.pluginBridge.on("appearance:changed", applyAppearance);
      window.pluginBridge.invoke("app.getAppearance").then(applyAppearance).catch((error) => {
        notice.textContent = `Appearance unavailable: ${error?.message ?? error}`;
      });
      void update();
      window.setInterval(() => { if (!document.hidden) void update(); }, 2000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) void update(); });
    </script>
  </body>
</html>
